<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2026 강원수어문화제 업무분장</title>
</head>
<body>
<title>수어문화제 업무분장</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: 휴대폰 한 손 조작 — 제목 → 큰 이름 검색창 → 탭(이름 찾기·시간대별·부스별 명단·물품) */
:root{
  --bg:#fbf3e6; --paper:#fffaf1; --ink:#3b2418; --muted:#7a5a46; --line:#ead7bd;
  --maple:#d9541e; --amber:#e9a23b; --moss:#6f7f3e; --wine:#8e2f23; --chip:#f6e3c6; --hl:#fff0a8;
  --f-display:"Black Han Sans","Noto Sans KR",sans-serif;
  --f-body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1f1510; --paper:#2a1d16; --ink:#f5e6d3; --muted:#c7a98f; --line:#4a3426;
  --maple:#f07a3e; --amber:#f2b85a; --moss:#a7b56f; --wine:#e0735f; --chip:#3a281d; --hl:#5a4a10; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1f1510; --paper:#2a1d16; --ink:#f5e6d3; --muted:#c7a98f; --line:#4a3426;
  --maple:#f07a3e; --amber:#f2b85a; --moss:#a7b56f; --wine:#e0735f; --chip:#3a281d; --hl:#5a4a10; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;word-break:keep-all}
.wrap{max-width:820px;margin:0 auto;padding-inline:16px;padding-block:20px 60px}
h1,h2,h3{margin:0;text-wrap:balance}
.top small{display:block;color:var(--maple);font-weight:700;font-size:.82rem;letter-spacing:.05em}
.top h1{font-family:var(--f-display);font-weight:400;font-size:clamp(1.6rem,6vw,2.1rem);line-height:1.2}
.top p{margin:4px 0 0;color:var(--muted);font-size:.9rem}
.search{margin-top:16px;position:relative}
.search input{width:100%;font:inherit;font-size:1.15rem;padding:14px 16px 14px 46px;border-radius:14px;border:2px solid var(--line);background:var(--paper);color:var(--ink)}
.search input:focus{outline:none;border-color:var(--maple)}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:22px;height:22px;color:var(--muted)}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:6px;margin-top:14px;padding-block:8px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line)}
.tab{flex:none;font:inherit;font-weight:700;font-size:.95rem;padding:8px 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer}
.tab[aria-selected="true"]{background:var(--maple);border-color:var(--maple);color:#fff}
.tab:focus-visible,.btn:focus-visible,.pill:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.view{margin-top:16px}
.hint{color:var(--muted);font-size:.92rem;margin:4px 2px 0}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:18px;margin-top:12px}
.me-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 12px}
.me-head h2{font-size:1.4rem}
.badge{display:inline-block;font-size:.75rem;font-weight:700;padding:2px 10px;border-radius:999px;background:var(--chip);color:var(--moss)}
.badge.vol{color:var(--wine)}
.booth-line{display:flex;gap:12px;align-items:center;margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--maple);color:#fff}
.no{flex:none;min-width:38px;height:38px;border-radius:19px;display:grid;place-items:center;background:#fff;color:var(--maple);font-family:var(--f-display);font-size:1.15rem;font-variant-numeric:tabular-nums;padding-inline:6px}
.booth-line b{display:block;font-size:1.05rem;line-height:1.35}
.booth-line span{font-size:.85rem;opacity:.92}
.sec{margin-top:14px}
.sec h3{font-size:.8rem;letter-spacing:.06em;color:var(--maple);margin-bottom:4px}
.sec ol,.sec ul{margin:0;padding-left:1.3em;display:grid;gap:3px}
.sec p{margin:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.items{display:flex;flex-wrap:wrap;gap:6px}
.items span{font-size:.88rem;padding:3px 10px;border-radius:8px;background:var(--chip)}
.power{display:inline-block;margin-top:6px;font-size:.82rem;font-weight:700;color:var(--wine)}
.note{margin-top:10px;padding:8px 12px;border-radius:10px;background:var(--hl);font-size:.9rem}
.mates{display:flex;flex-wrap:wrap;gap:6px}
.pill{font:inherit;font-size:.88rem;padding:4px 12px;border-radius:999px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.pill.self{background:var(--maple);border-color:var(--maple);color:#fff}
.pill.ghost{cursor:default;color:var(--muted);border-style:dashed}
.bgrid{display:grid;gap:12px}
.bcard h2{font-size:1.1rem;line-height:1.35}
.bcard .sub{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.bcard .sub:first-of-type{border-top:0;padding-top:0}
.bcard h4{margin:0 0 6px;font-size:1rem}
.who{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:.92rem;align-items:start}
.who dt{color:var(--muted)}
.who dd{margin:0}
.people{width:100%;border-collapse:collapse;font-size:.92rem}
.people th,.people td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
.people th{font-size:.78rem;color:var(--muted);font-weight:700;letter-spacing:.04em}
.people tr[data-n]{cursor:pointer}
.people tr[data-n]:hover td{background:var(--chip)}
.tblwrap{overflow-x:auto;background:var(--paper);border:1px solid var(--line);border-radius:14px;margin-top:12px}
.chk{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.chk label{display:flex;gap:8px;align-items:flex-start;font-size:.93rem;cursor:pointer}
.chk input{width:18px;height:18px;margin-top:3px;accent-color:var(--maple);flex:none}
.chk input:checked + span{text-decoration:line-through;color:var(--muted)}
.prog{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.btn{font:inherit;font-size:.85rem;padding:6px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer}
.tl{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:12px}
.blk{display:grid;grid-template-columns:92px 1fr;background:var(--paper);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.blk .when{background:var(--maple);color:#fff;padding:14px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
.blk .when b{font-family:var(--f-display);font-weight:400;font-size:1.5rem;line-height:1.1;font-variant-numeric:tabular-nums}
.blk .when span{font-size:.85rem;font-variant-numeric:tabular-nums;opacity:.95}
.blk .when em{font-style:normal;font-size:.72rem;font-weight:700;margin-top:6px;padding:1px 8px;border-radius:999px;background:rgba(255,255,255,.22)}
.blk.prep .when,.blk.end .when{background:var(--moss)}
.blk.rest .when{background:var(--amber);color:#3b2418}
.blk.rest .when em{background:rgba(0,0,0,.08)}
.blk .body{padding:14px 16px;min-width:0}
.blk h3{font-size:1.1rem;line-height:1.4}
.blk h3 small{font-size:.75rem;color:var(--maple);font-weight:700;margin-right:2px}
.stage{margin:2px 0 0;font-size:.85rem;color:var(--muted)}
.tasks{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:8px}
.task{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:6px 12px;align-items:start;padding-top:8px;border-top:1px dashed var(--line)}
.task:first-child{border-top:0;padding-top:0}
.task .what{font-weight:700;font-size:.95rem}
.task.hit .what::before{content:"내 업무 ";color:var(--maple)}
.task .who{display:block}
.who .mates{display:flex;flex-wrap:wrap;gap:6px}
.glabel{display:block;font-size:.78rem;color:var(--muted);margin-bottom:4px}
.glabel.all{display:inline-block;margin:0;padding:3px 10px;border-radius:999px;background:var(--chip);color:var(--ink);font-size:.85rem;font-weight:500}
@media (max-width:560px){.blk{grid-template-columns:72px 1fr}.blk .when b{font-size:1.2rem}.task{grid-template-columns:1fr}}
.map-scroll{overflow-x:auto;border-radius:16px;border:1px solid var(--line);-webkit-overflow-scrolling:touch;margin-top:8px}
.fmap{display:block;width:100%;height:auto}
.fmap .mlab text{font:700 17px var(--f-body);fill:#3b2418}
.fmap .tn{font:400 21px var(--f-display);fill:#3b2418}
.fmap .tl2{font:700 15px var(--f-body);fill:#fffaf1}
.fmap a.tent{cursor:pointer}
.fmap a.tent>*{transition:transform .2s}
.fmap a.tent:hover>*,.fmap a.tent.sel>*{transform:translateY(-6px)}
.fmap a.tent.sel use:first-child{filter:drop-shadow(0 0 6px #f2b85a) drop-shadow(0 0 2px #f2b85a)}
.fmap a.tent.sel rect{fill:var(--maple)}
.fmap a.tent:focus-visible{outline:none}
#mapInfo{margin-top:12px}
#mapInfo .sub{margin-top:14px;padding-top:14px;border-top:1px dashed var(--line)}
#mapInfo .sub:first-of-type{border-top:0;padding-top:0}
#mapInfo h4{margin:0 0 4px;font-size:1.02rem}
#mapInfo .what{margin:0 0 8px;color:var(--muted);font-size:.9rem}
@media (max-width:560px){.fmap{min-width:560px}}
@media (prefers-reduced-motion:reduce){.fmap a.tent>*{transition:none}}
.ov-sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 14px}
.ov-sum div{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:10px 8px;text-align:center}
.ov-sum b{display:block;font-family:var(--f-display);font-weight:400;font-size:1.6rem;color:var(--maple);line-height:1.1;font-variant-numeric:tabular-nums}
.ov-sum span{font-size:.8rem;color:var(--muted)}
.ov-band{display:flex;align-items:flex-start;gap:8px;background:var(--chip);border-radius:12px;padding:10px 14px;font-size:.9rem;margin-bottom:16px}
.ov-band b{color:var(--moss)}
.ov{list-style:none;margin:0;padding:0;position:relative;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:6px 16px}
.ov::before{content:"";position:absolute;left:92px;top:22px;bottom:22px;width:2px;background:var(--line)}
.ov>li{display:grid;grid-template-columns:62px 1fr;gap:34px;padding-block:13px;position:relative;border-top:1px dashed var(--line)}
.ov>li:first-child{border-top:0}
.ov>li::after{content:"";position:absolute;left:70px;top:19px;width:14px;height:14px;border-radius:50%;background:var(--paper);border:3px solid var(--amber)}
.ov>li.prep::after,.ov>li.end::after{border-color:var(--moss)}
.ov>li.film::after{border-color:var(--wine)}
.ov>li.now::after{background:var(--maple);border-color:var(--maple);box-shadow:0 0 0 6px color-mix(in srgb,var(--maple) 25%,transparent)}
.ov time{font-variant-numeric:tabular-nums;font-weight:700;color:var(--muted);font-size:.92rem;text-align:right;line-height:1.35}
.ov .k{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 9px;border-radius:999px;margin-bottom:3px;background:var(--chip);color:var(--maple)}
.ov .prep .k,.ov .end .k{color:var(--moss)}
.ov .film .k{color:var(--wine)}
.ov h3{font-size:1.05rem;line-height:1.4}
.ov p{margin:3px 0 0;color:var(--muted);font-size:.9rem}
.ov .who{display:block;margin-top:5px;font-size:.88rem;color:var(--ink)}
.ov .who b{color:var(--maple)}
.ov .teams{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:3px;font-size:.9rem}
.ov .teams i{font-style:normal;display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--chip);color:var(--maple);font-size:.72rem;font-weight:700;margin-right:6px}
.ov .teams .sp i{background:var(--maple);color:#fff}
.ov .teams span{color:var(--muted);margin-left:6px;font-size:.84rem}
.ov .live{display:none;margin-left:6px;font-size:.72rem;color:#fff;background:var(--maple);padding:2px 8px;border-radius:999px;vertical-align:middle}
.ov li.now .live{display:inline-block}
@media (max-width:560px){.ov{padding:4px 12px}.ov::before{left:70px}.ov>li{grid-template-columns:46px 1fr;gap:28px}.ov>li::after{left:56px}.ov time{font-size:.85rem}.ov .teams span{display:block;margin-left:26px}}
.ovt{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:6px}
.ovt li{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;font-size:.88rem;padding:6px 10px;background:var(--bg);border-radius:10px}
.ovt li.mine{background:color-mix(in srgb,var(--maple) 14%,var(--bg))}
.ovt li.mine .w::before{content:"내 업무 · ";color:var(--maple);font-weight:700}
.ovt .w{font-weight:700}
.ovt .ppl{display:flex;flex-wrap:wrap;gap:4px}
.pill.sm{font-size:.8rem;padding:2px 9px}
.more{margin-top:14px;border-top:1px dashed var(--line);padding-top:10px}
.more summary{cursor:pointer;font-weight:700;color:var(--maple);font-size:.92rem}
.mytime li b{font-variant-numeric:tabular-nums;margin-right:4px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;background:var(--chip);border-radius:12px;margin-top:14px}
.seg button{font:inherit;font-weight:700;font-size:.92rem;border:0;border-radius:9px;padding:8px;background:transparent;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--paper);color:var(--maple);box-shadow:0 1px 3px rgba(60,30,10,.15)}
.job{margin:0;padding-left:20px;font-weight:700}
.job1{margin:0;font-weight:700}
.job1 b{color:var(--maple);font-size:.9rem}
.sec .mt{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.mt li{display:grid;grid-template-columns:62px 1fr;gap:10px;align-items:start;padding:8px 10px;border-radius:10px;background:var(--bg);font-size:.92rem}
.mt time{font-weight:700;font-variant-numeric:tabular-nums;color:var(--maple);line-height:1.3}
.mt time small{display:block;font-size:.78rem;color:var(--muted);font-weight:500}
.meal{display:flex;flex-wrap:wrap;gap:6px}
.sec .guide{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.guide li{padding:8px 12px;background:var(--bg);border-radius:10px;font-size:.92rem;line-height:1.55}
.guide small{color:var(--muted);font-size:.8rem}
.linkbtn{font:inherit;font-weight:700;color:var(--maple);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline}
.sec .lc{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.lc li{display:flex;justify-content:space-between;gap:10px;padding:6px 10px;background:var(--bg);border-radius:8px;font-size:.9rem}
.lc b{color:var(--maple);font-variant-numeric:tabular-nums;white-space:nowrap}
.mp{display:inline-flex;gap:6px;align-items:center;font-size:.88rem;padding:4px 12px;border-radius:999px;border:1.5px solid var(--line);color:var(--muted)}
.mp b{color:var(--ink)}
.mp.on{border-color:var(--moss);color:var(--moss);font-weight:700}
.empty{text-align:center;color:var(--muted);padding:30px 0}
.foot{margin-top:28px;font-size:.8rem;color:var(--muted)}
@media (max-width:560px){.two{grid-template-columns:1fr}}
</style>

    <h1>업무분장</h1>

  $('v-home').innerHTML = ''
    + '<div class="ov-band">🎪 <span><b>부스 운영</b> 11:00~16:00 (12:00~13:00 쉬는 시간) · 부스별 담당은 [부스 지도]에서 볼 수 있어요.</span></div>'
    + '<ol class="ov">' + OVERVIEW.map(x => '<li class="' + x.c + '" data-s="' + x.s + '" data-e="' + (x.e || '') + '"><time>' + x.s + (x.e ? '<br>' + x.e : '') + '</time><div><span class="k">' + x.k + '</span><h3>' + esc(x.h) + '<span class="live">진행 중</span></h3>'
      + (x.p ? '<p>' + esc(x.p) + '</p>' : '')
      + (x.teams ? '<ul class="teams">' + x.teams.map(t => '<li' + (t[3] ? ' class="sp"' : '') + '><i>' + t[0] + '</i><b>' + esc(t[1]) + '</b><span>' + esc(t[2]) + '</span></li>').join('') + '</ul>' : '')
      + (x.tasks ? '<ul class="ovt">' + x.tasks.filter(t => !t[2]).map(([w,k]) => { const g = GROUPS[k];
          const mine = q && (g.names ? g.names.some(n => n.includes(q)) : g.type && PEOPLE.some(pp => pp.booth.no && (g.type === '*' || pp.type === g.type) && !(g.noHQ && pp.booth.no === 1) && pp.name.includes(q)));
          const who = g.names ? g.names.map(n => '<button type="button" class="pill sm' + (q && n.includes(q) ? ' self' : '') + '" data-n="' + esc(n) + '">' + esc(n) + '</button>').join('') : '<span class="pill sm ghost">' + esc(g.label) + '</span>';
          return '<li' + (mine ? ' class="mine"' : '') + '><span class="w">' + esc(w) + '</span><span class="ppl">' + who + '</span></li>'; }).join('') + '</ul>' : '')
      + '</div></li>').join('') + '</ol>';
  markNow();
}
function markNow(){
  const d = new Date(), today = d.getFullYear() === 2026 && d.getMonth() === 9 && d.getDate() === 24;
  const m = d.getHours() * 60 + d.getMinutes(), toM = t => +t.slice(0,2) * 60 + +t.slice(3);
  const li = [...document.querySelectorAll('.ov>li')];
  li.forEach((el, i) => { const s = toM(el.dataset.s), e = el.dataset.e ? toM(el.dataset.e) : (li[i+1] ? toM(li[i+1].dataset.s) : s + 30);
    el.classList.toggle('now', today && m >= s && m < e); });
}
setInterval(markNow, 60000);

// ===== 역할 (이름 찾기) =====
function renderMe(){
  const q = $('q').value.trim();
  const v = $('v-me');
  if (!q) { v.innerHTML = '<p class="hint">위 검색창에 이름을 입력하면 개별 업무가 나와요.</p>'; return; }
  const hits = PEOPLE.filter(p => p.name.includes(q));
  if (!hits.length) { v.innerHTML = '<p class="empty">"' + esc(q) + '" 이름을 찾지 못했어요.<br>이름이 없으면 총괄본부에 알려 주세요.</p>'; return; }
  const li = a => a.map(x => '<li>' + esc(x) + '</li>').join('');
  v.innerHTML = hits.map((p, idx) => {
    const s = p.sub, b = p.booth, vol = p.type === '지원';
    const rows = OVERVIEW.filter(x => x.tasks).flatMap(x => x.tasks.filter(([w,k]) => GROUPS[k].names ? GROUPS[k].names.includes(p.name) : b.no && (GROUPS[k].type === '*' || GROUPS[k].type === p.type) && !(GROUPS[k].noHQ && b.no === 1)).filter(([w]) => !w.startsWith('부스 운영')).map(([w]) => [x.s, x.e || '', w]));
    if (b.no) rows.push(['11:00', '16:00', s.title + (b.no === 1 ? ' 운영' : ' 운영 (12:00~13:00 쉬는 시간)'), 1]);
    const ridersAll = Object.keys(VOLINFO).filter(n => VOLINFO[n][1]);
    const rideEat = ridersAll.filter(n => VOLINFO[n][0]), rideGo = ridersAll.filter(n => !VOLINFO[n][0]);
    if (p.name === '한주례') rows.push(['행사 후', '', '석식에 참가하지 않는 자원봉사자 ' + rideGo.length + '명을 춘천역까지 차량으로 배웅']);
    if (p.name === '원태연') rows.push(['석식 후', '', '석식에 참가한 자원봉사자 ' + rideEat.length + '명을 춘천역까지 차량으로 배웅']);
    rows.sort((x, y) => x[0] === y[0] ? (y[3]||0) - (x[3]||0) : x[0] < y[0] ? -1 : 1);
    const mine = vol && s.volByName && s.volByName[p.name];
    const job = mine ? '<ul class="job">' + li(mine) + '</ul>'
      : '<p class="job1">' + esc(p.role || s.what) + '</p>';
    const m = meal(p), yn = (k, on, t1, t0) => '<span class="mp' + (on ? ' on' : '') + '"><b>' + k + '</b>' + (on ? t1 : t0) + '</span>';
    const CARNO = ' <small>(차량 번호는 다음 주에 안내)</small>';
    const guide = [];
    if (m.car) guide.push('🚐 <b>아침</b> 9:30에 춘천역에서 차량으로 출발해요.' + CARNO);
    if (m.dinner === true) guide.push('🍽️ 행사 후 <b>저녁 식사에 함께해요.</b>');
    if (m.dinner === false) guide.push('🍽️ 행사 후 저녁 식사는 하지 않아요.');
    if (m.car && m.dinner) guide.push('🚐 <b>행사 후</b> 저녁 식사를 마치고 <b>원태연 선생님 차량</b>으로 춘천역까지 이동해요.' + CARNO);
    if (m.car && !m.dinner) guide.push('🚐 <b>행사 후</b> <b>한주례 선생님 차량</b>으로 춘천역까지 이동해요.' + CARNO);
    const mealHtml = p.type === '지원' && guide.length ? '<div class="sec"><h3>식사 · 이동 안내</h3><ul class="guide">' + guide.map(g => '<li>' + g + '</li>').join('') + '</ul></div>' : '';
    const chips = a => '<div class="mates">' + a.map(n => '<button type="button" class="pill" data-n="' + esc(n) + '">' + esc(n) + '</button>').join('') + '</div>';
    const carHtml = p.name === '원태연' ? '<div class="sec"><h3>차량 이용 자원봉사자 (' + ridersAll.length + '명)</h3>'
        + '<p class="hint" style="margin:4px 0">석식 후 내가 배웅 (' + rideEat.length + '명)</p>' + chips(rideEat)
        + '<p class="hint" style="margin:10px 0 4px">석식 불참 → 한주례 차량 (' + rideGo.length + '명)</p>' + chips(rideGo) + '</div>'
      : p.name === '한주례' ? '<div class="sec"><h3>춘천역까지 배웅할 자원봉사자 (' + rideGo.length + '명)</h3>' + chips(rideGo) + '</div>' : '';
    const lunchHtml = GROUPS.GOODS.names.includes(p.name)
      ? '<div class="sec"><h3>중식 배부</h3><p class="job1" style="font-weight:500">부스별 점심 인원은 <button type="button" class="linkbtn" data-goto="1">[부스 안내]</button> 탭에서 확인하세요.</p></div>' : '';
    const pane1 = '<div class="sec"><h3>맡은 일</h3>' + job + '</div>' + carHtml + lunchHtml + mealHtml
      + '<div class="sec"><h3>내 일정</h3><ol class="mt">' + rows.map(r => '<li' + (r[3] ? ' class="base"' : '') + '><time>' + r[0] + (r[1] ? '<small>~' + r[1] + '</small>' : '') + '</time><span>' + esc(r[2]) + '</span></li>').join('') + '</ol></div>';
    const pane2 = (s.prep ? '<div class="sec"><h3>미리 준비 (9:00~)</h3><ul>' + li(s.prep) + '</ul></div>' : '')
      + (s.staffHow ? '<div class="sec"><h3>부스 할 일</h3><ol>' + li(s.staffHow) + '</ol></div>' : '')
      + (s.volHow ? '<div class="sec"><h3>지원 할 일</h3><ul>' + li(s.volHow) + '</ul></div>' : '')
      + (s.guestHow ? '<div class="sec"><h3>참여자는 이렇게 해요</h3><ol>' + li(s.guestHow) + '</ol></div>' : '')
      + '<div class="sec"><h3>필요한 물품</h3>' + itemsHtml(s) + '</div>'
      + (s.note ? '<p class="note">' + esc(s.note) + '</p>' : '')
      + '<div class="sec"><h3>함께하는 사람</h3><div class="mates">' + mates(s, p.name) + '</div></div>'
      + (b.no === 1 ? lunchAcc() : '');
    return '<article class="card"><div class="me-head"><h2>' + esc(p.name) + '</h2><span class="badge' + (vol?' vol':'') + '">' + p.type + '</span></div>'
      + '<div class="booth-line"><span class="no">📍</span><div><b>' + esc(s.title) + '</b><span>' + esc(b.name) + '</span></div></div>'
      + '<div class="seg" role="tablist"><button type="button" class="on" data-pane="0">내 업무</button><button type="button" data-pane="1">부스 안내</button></div>'
      + '<div class="pane">' + pane1 + '</div><div class="pane" hidden>' + pane2 + '</div></article>';
  }).join('');
}

// ===== 부스 지도 =====
let mapSel = 1;
function renderMap(){
  const q = $('q').value.trim();
  const hit = q && PEOPLE.find(p => p.name.includes(q) && p.booth.no);
  if (hit && renderMap.lastQ !== q) mapSel = hit.booth.no;
  renderMap.lastQ = q;
  document.querySelectorAll('#v-map a.tent').forEach(t => t.classList.toggle('sel', +t.dataset.b === mapSel));
  const b = BOOTHS.find(x => x.no === mapSel); if (!b) return;
  $('mapInfo').innerHTML = '<article class="card"><div class="me-head"><h2 style="font-size:1.1rem">' + esc(b.name) + '</h2></div>'
    + b.subs.map(s => '<div class="sub" style="margin-top:12px"><h4>' + esc(s.title) + '</h4><p class="what">' + esc(s.what) + '</p>'
      + '<div class="mates">' + mates(s, hit ? hit.name : '') + '</div>'
      + (s.staffHow ? '<div class="sec"><h3>할 일</h3><ol>' + s.staffHow.map(x=>'<li>'+esc(x)+'</li>').join('') + '</ol></div>' : '')
      + (s.volHow ? '<div class="sec"><h3>지원이 할 일</h3><ul>' + s.volHow.map(x=>'<li>'+esc(x)+'</li>').join('') + '</ul></div>' : '')
      + '<div class="sec"><h3>필요한 물품</h3>' + itemsHtml(s) + '</div>'
      + (s.note ? '<p class="note">' + esc(s.note) + '</p>' : '') + '</div>').join('')
    + (b.no === 1 ? lunchAcc() : '')
    + '</article>';
}
document.addEventListener('click', e => {
  const t = e.target.closest('#v-map a.tent'); if (!t) return;
  e.preventDefault(); mapSel = +t.dataset.b; renderMap();
  $('mapInfo').scrollIntoView({ behavior:'smooth', block:'start' });
});

// ===== 전체 명단 (가나다순) =====
function renderAll(){
  const list = [...PEOPLE].sort((a,b) => a.name.localeCompare(b.name,'ko'));
  const staffN = PEOPLE.filter(p=>p.type==='담당').length, volN = PEOPLE.length - staffN;
  const extra = BOOTHS.flatMap(b=>b.subs).reduce((t,s)=>t+(s.volExtra||0),0);
  $('v-all').innerHTML = '<p class="hint">이름이 있는 사람 ' + PEOPLE.length + '명 (담당 ' + staffN + '명, 지원 ' + volN + '명). 이름을 누르면 업무가 나와요.</p>'
    + '<div class="tblwrap"><table class="people"><thead><tr><th>이름</th><th>구분</th><th>업무</th><th>중식</th><th>석식</th><th>(도)차량</th></tr></thead><tbody>'
    + list.map(p => '<tr data-n="' + esc(p.name) + '"><td><b>' + esc(p.name) + '</b></td><td>' + p.type + '</td><td>' + esc(p.sub.title) + '</td>' + (m => '<td>' + (m.lunch?'○':'-') + '</td><td>' + (m.dinner?'○':'-') + '</td><td>' + (m.car?'○':'-') + '</td>')(meal(p)) + '</tr>').join('')
    + '</tbody></table></div>';
}

// ===== 물품 체크 (이 휴대폰에만 저장) =====
function renderItems(){
  const st = ls.get('gw-assign-items') || {};
  let total = 0, done = 0;
  const blocks = BOOTHS.filter(b => b.subs.some(s => s.items.length)).map(b => {
    const rows = b.subs.flatMap(s => s.items.map((it,i) => { const k = b.no + '|' + s.title + '|' + i; total++; if (st[k]) done++;
      return '<li><label><input type="checkbox" data-k="' + esc(k) + '"' + (st[k]?' checked':'') + '><span>' + esc(it) + (b.subs.length>1 ? ' <small style="color:var(--muted)">(' + esc(s.title) + ')</small>' : '') + '</span></label></li>'; }));
    if (!rows.length) return '';
    const pw = b.subs.some(s=>s.power) ? ' <span class="power">⚡ 전기</span>' : '';
    return '<article class="card"><div class="me-head"><h2 style="font-size:1.05rem">' + esc(b.name) + '</h2>' + pw + '</div><ul class="chk" style="margin-top:10px">' + rows.join('') + '</ul></article>';
  }).join('');
  const common = COMMON_ITEMS.map((it,i) => { const k='common|'+i; total++; if (st[k]) done++; return '<li><label><input type="checkbox" data-k="'+k+'"'+(st[k]?' checked':'')+'><span>'+esc(it)+'</span></label></li>'; }).join('');
  $('v-items').innerHTML = '<div class="me-head" style="justify-content:space-between"><span class="prog">준비 완료 ' + done + ' / ' + total + '</span><button type="button" class="btn" id="resetItems">체크 모두 지우기</button></div>'
    + '<p class="hint">체크 표시는 이 휴대폰에만 저장돼요.</p>'
    + '<article class="card"><h2 style="font-size:1.05rem">공통</h2><ul class="chk" style="margin-top:10px">' + common + '</ul></article>' + blocks;
}
document.addEventListener('change', e => {
  if (!e.target.matches('#v-items input[type=checkbox]')) return;
  const st = ls.get('gw-assign-items') || {}; st[e.target.dataset.k] = e.target.checked; ls.set('gw-assign-items', st); renderItems();
});
document.addEventListener('click', e => {
  const go = e.target.closest('[data-goto]');
  if (go) { const c = go.closest('.card'); c.querySelector('.seg button[data-pane="' + go.dataset.goto + '"]').click(); c.querySelector('.more') && (c.querySelector('.more').open = true); return; }
  const sg = e.target.closest('.seg button');
  if (sg) { const c = sg.closest('.card'); c.querySelectorAll('.seg button').forEach(x => x.classList.toggle('on', x === sg)); c.querySelectorAll('.pane').forEach((x, i) => x.hidden = i != sg.dataset.pane); return; }
  if (e.target.id === 'resetItems') { ls.set('gw-assign-items', {}); renderItems(); return; }
  const n = e.target.closest('[data-n]'); if (!n) return;
  $('q').value = n.dataset.n; show('me'); window.scrollTo({ top: 0, behavior: 'smooth' });
});

// ===== 탭 =====
let cur = 'me';
const R = { home:renderHome, me:renderMe, map:renderMap, all:renderAll, items:renderItems };
function show(v){
  cur = v;
  document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', t.dataset.v === v));
  document.querySelectorAll('.view').forEach(s => s.hidden = s.id !== 'v-' + v);
  R[v]();
}
document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => show(t.dataset.v)));
$('q').addEventListener('input', () => { if (cur !== 'me' && cur !== 'map') show('me'); else R[cur](); });
show('home');
</script>

</body>
</html>
